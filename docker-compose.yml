services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: concierge_ride
      POSTGRES_USER: concierge
      POSTGRES_PASSWORD: concierge
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U concierge -d concierge_ride']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
